# Cloudflare Pages configuration for personal-hub.
#
# Charlie's personal operating surface — a fork of team-hub configured to
# converge with the private command center on zo.space.

name = "personal-hub"
compatibility_date = "2026-08-13"
pages_build_output_dir = "site"

# Names this hub to MCP clients.
[vars]
HUB_NAME = "personal-hub"

# Backs functions/api/ — the team drop, build downloads and meeting media.
[[r2_buckets]]
binding = "HUB_FILES"
bucket_name = "personal-hub-files"

# Preview deploys need their own copy of every binding.
[env.preview]

[env.preview.vars]
HUB_NAME = "personal-hub"

[[env.preview.r2_buckets]]
binding = "HUB_FILES"
bucket_name = "personal-hub-files"
